    <!-- Theme (dark/light) — set class trước khi render để tránh nháy màu -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('viway-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.classList.add(t);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
