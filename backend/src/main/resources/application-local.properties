# ============================================
# FIT Challenge - Local Development Profile
# ============================================
# S\u1EED d\u1EE5ng khi ch\u1EA1y b\u1EB1ng IDE ho\u1EB7c ch\u1EA1y file JAR local
# Profile: local
# Usage: java -jar app.jar --spring.profiles.active=local
#        ho\u1EB7c trong IDE: Run Configuration > VM options: -Dspring.profiles.active=local

# ============================================
# Database Configuration (Local PostgreSQL)
# M\u1EB7c \u0111\u1ECBnh k\u1EBFt n\u1ED1i v\u00E0o PostgreSQL container \u0111ang \u0111\u01B0\u1EE3c expose \u1EDF port 5432
# (docker-compose.local.yml: "5432:5432")
# N\u1EBFu b\u1EA1n d\u00F9ng PostgreSQL c\u00E0i tr\u1EF1c ti\u1EBFp, c\u00F3 th\u1EC3 override b\u1EB1ng SPRING_DATASOURCE_URL
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fit_challenge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# \u26A0\uFE0F SECURITY: Set SPRING_DATASOURCE_PASSWORD environment variable
# Set SPRING_DATASOURCE_PASSWORD in your local environment
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (optimized for local development)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=120000

# ============================================
# JPA Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ============================================
# JWT Configuration (from environment variables)
# ============================================
# \u26A0\uFE0F SECURITY: Set JWT_SECRET environment variable (min 32 chars)
# Set JWT_SECRET in your local environment
jwt.secret=${JWT_SECRET:du-an-safjhdskfjskjliuuasdhaos-2321}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================
# Storage Configuration
# ============================================
# Local uploads directory (served at /uploads/**)
upload.path=${UPLOAD_PATH:uploads/}

# Optional: if set, FileController will return absolute URLs
app.publicBaseUrl=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# ============================================
# Logging Configuration (Verbose for debugging)
# ============================================
logging.level.root=INFO
logging.level.com.example.fitchallenge=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# CORS Configuration (Local Development)
# ============================================
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:5174,http://localhost:5175

# ============================================
# Python AI Service URL
# ============================================
ai.service.url=http://localhost:8001

# ============================================
# DevTools (for IDE hot reload)
# ============================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
