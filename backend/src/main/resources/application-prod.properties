# ============================================
# FIT Challenge — Production Profile
# ============================================
# Usage: java -jar app.jar --spring.profiles.active=prod
#
# ALL sensitive values MUST come from environment variables.
# Never hard-code secrets here.
# ============================================

# ============================================
# Database (required env vars)
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool — tuned for production load
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.pool-name=FitChallengeHikariPool

# ============================================
# JPA — production safe
# ============================================
# NEVER use create/create-drop in production; Flyway manages the schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================
# Flyway — manages schema in production
# ============================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ============================================
# JWT (required env var)
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================
# Error handling — never expose stack traces
# ============================================
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ============================================
# Server
# ============================================
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# ============================================
# Storage
# ============================================
storage.provider=${STORAGE_PROVIDER:local}
upload.path=${UPLOAD_PATH:/app/uploads/}
s3.upload.bucket=${S3_UPLOAD_BUCKET:}
aws.region=${AWS_REGION:ap-southeast-1}
app.publicBaseUrl=${APP_PUBLIC_BASE_URL}

# ============================================
# File upload limits (reduced from dev 3000MB)
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ============================================
# Logging — production (no SQL, no debug)
# ============================================
logging.level.root=WARN
logging.level.com.example.fitchallenge=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=INFO

# Log format for structured logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# Actuator — minimal surface in production
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true

# ============================================
# CORS — production origins from env var
# Set CORS_ALLOWED_ORIGINS=https://yourapp.com,https://www.yourapp.com
# ============================================
# CorsConfig.java reads this property. Supply CORS_ALLOWED_ORIGINS as an env var.
# No default — an error at startup is preferable to silently allowing localhost in prod.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ============================================
# Google OAuth (đăng nhập bằng Google) — trống = tắt
# ============================================
google.oauth.client-id=${GOOGLE_CLIENT_ID:}

# ============================================
# AI Service
# ============================================
ai.service.url=${AI_SERVICE_URL:http://ai-service:8001}
# Fail fast nếu AI service không khởi động (3s connect, 90s read cho Groq)
ai.rest.connect-timeout=3000
ai.rest.read-timeout=90000

# ============================================
# Swagger / OpenAPI — disabled in production
# ============================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ============================================
# DevTools — explicitly disabled in production
# ============================================
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ============================================
# VNPay — cổng thanh toán gói AI trả phí
# ============================================
# Đăng ký merchant tại https://vnpayment.vn để lấy TMN_CODE & HASH_SECRET.
# Khi 2 biến này trống, AiPackageServiceImpl fail-closed (từ chối mọi callback):
# gói FREE vẫn hoạt động, chỉ gói trả phí (PLUS/PRO) là chưa dùng được.
# → Có thể deploy trước, set credentials sau khi merchant được duyệt.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
# Endpoint cổng thanh toán:
#   Sandbox    : https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
#   Production : https://vnpayment.vn/paymentv2/vpcpay.html
# Mặc định để sandbox cho an toàn — set VNPAY_URL sang production khi go-live.
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
# Trang FE người dùng quay về sau thanh toán — mặc định bám theo FRONTEND_URL.
vnpay.return-url=${VNPAY_RETURN_URL:${FRONTEND_URL:http://localhost:5173}/payment/result}
# Webhook IPN (server-to-server) — cấu hình trong cổng merchant VNPay; phải là
# domain backend public https. Override bằng VNPAY_IPN_URL.
vnpay.ipn-url=${VNPAY_IPN_URL:${APP_PUBLIC_BASE_URL:http://localhost:8080}/api/ai-packages/payment/ipn}
