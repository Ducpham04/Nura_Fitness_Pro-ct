# ============================================
# FIT Challenge - Application Configuration
# ============================================
# C\u1EA5u h\u00ECnh chung cho t\u1EA5t c\u1EA3 c\u00E1c profile
# Profile-specific configs s\u1EBD override c\u00E1c gi\u00E1 tr\u1ECB n\u00E0y

spring.application.name=FIT_Challenge

# ============================================
# Default Profile (n\u1EBFu kh\u00F4ng set profile, d\u00F9ng local)
# ============================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ============================================
# Database Configuration (Default - Local)
# ============================================
# Default config cho khi kh\u00F4ng set profile
# Profile-specific s\u1EBD override
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fit_challenge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# \u26A0\uFE0F SECURITY: Set SPRING_DATASOURCE_PASSWORD environment variable for production
# For local development, set SPRING_DATASOURCE_PASSWORD in your environment
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (defaults)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ============================================
# JPA Configuration (Default)
# ============================================
# Safe default: "update" keeps schema without dropping; prod overrides to "validate"
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Flyway: tắt mặc định (local/dev dùng Hibernate ddl-auto cho nhanh).
# Prod bật qua application-prod.properties + ddl-auto=validate.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ============================================
# Server Configuration
# ============================================
server.port=8080
# "on_param" = only expose details when ?message=true query param is set (useful for debugging, safe otherwise)
server.error.include-message=on_param
server.error.include-binding-errors=on_param

# ============================================
# File Upload Configuration
# ============================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ============================================
# Storage Configuration
# ============================================
# local = luu vao filesystem, s3 = upload len Amazon S3
storage.provider=${STORAGE_PROVIDER:local}
# Local uploads directory (served at /uploads/**)
upload.path=${UPLOAD_PATH:uploads/}
# S3 uploads (used when STORAGE_PROVIDER=s3)
aws.region=${AWS_REGION:ap-southeast-1}
s3.upload.bucket=${S3_UPLOAD_BUCKET:}

# Optional: if set, FileController will return absolute URLs
# Example: http://localhost:8080
app.publicBaseUrl=${APP_PUBLIC_BASE_URL:}

# ============================================
# JWT Configuration (defaults, override in profiles)
# ============================================
# \u26A0\uFE0F SECURITY: Set JWT_SECRET environment variable for production (min 32 chars)
# For local development, set JWT_SECRET in your environment
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================
# Logging Configuration (defaults)
# ============================================
logging.level.root=INFO
logging.level.com.example.fitchallenge=INFO

# ============================================
# Actuator (for health checks)
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
# Mail là tùy chọn (forgot-password có graceful degradation). KHÔNG để health
# indicator của mail kéo /actuator/health xuống DOWN khi chưa cấu hình SMTP —
# nếu không, docker healthcheck prod sẽ coi backend unhealthy mãi mãi.
management.health.mail.enabled=false

# ============================================
# Sentry — giám sát lỗi runtime (tùy chọn)
# ============================================
# Để trống SENTRY_DSN = TẮT hoàn toàn (no-op). Khi có project Sentry, set
# SENTRY_DSN env là tự bật. send-default-pii=false vì đây là app sức khỏe.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SPRING_PROFILES_ACTIVE:local}
sentry.send-default-pii=false
# Chỉ log mức ERROR trở lên mới thành event (tiết kiệm quota free tier)
sentry.logging.minimum-event-level=error
# Performance tracing: 0 = tắt (chỉ bắt lỗi); tăng dần nếu cần đo hiệu năng
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.0}

# ============================================
# Python AI Service URL + HTTP Timeout
# ============================================
ai.service.url=${AI_SERVICE_URL:http://localhost:8001}
# connect-timeout: 10s — thiết lập kết nối TCP tới AI service
# read-timeout: 90s   — Groq có thể mất 30-40s; đặt buffer dư
ai.rest.connect-timeout=10000
ai.rest.read-timeout=90000

# Bí mật chia sẻ với fitness-ai-service để xác thực kết quả thi đã ký (HMAC).
# PHẢI trùng giá trị POSE_SIGNING_SECRET của fitness-ai-service.
pose.signing.secret=${POSE_SIGNING_SECRET:}

# ============================================
# CORS Configuration (defaults, override in profiles)
# ============================================
# Comma-separated list of allowed origins read by CorsConfig.java
# Override with CORS_ALLOWED_ORIGINS env var in production
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================
# VNPay Configuration
# ============================================
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payment/result}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/ai-packages/payment/ipn}

# ============================================
# Payment / QR Config (cấu hình chuyển khoản)
# ============================================
app.payment.qr-url=${PAYMENT_QR_URL:}
app.payment.bank-info=${PAYMENT_BANK_INFO:}
app.admin.email=${ADMIN_EMAIL:pvanduc0403@gmail.com}

# SePay auto-payment webhook — key lấy từ dashboard sepay.vn (Cấu hình → API/Webhook)
app.payment.sepay.api-key=${SEPAY_API_KEY:}

# ============================================
# Email / SMTP Configuration (optional)
# ============================================
# Set MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD env vars để bật email.
# Nếu không cấu hình, forgot-password endpoint vẫn hoạt động nhưng email không gửi
# (token được log ra console để debug local).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Địa chỉ gửi đi (from)
app.mail.from=${MAIL_FROM:noreply@fitnit.vn}
app.mail.from-name=${MAIL_FROM_NAME:Fitnit Challenge}
# URL frontend — dùng để build link reset-password trong email
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ============================================
# Google OAuth (đăng nhập bằng Google) — trống = tắt, backend vẫn boot bình thường
# ============================================
google.oauth.client-id=${GOOGLE_CLIENT_ID:}

# ============================================
# Swagger / OpenAPI Configuration
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.api-docs.groups.enabled=true
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
