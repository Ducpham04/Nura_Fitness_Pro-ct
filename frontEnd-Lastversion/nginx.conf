# =====================================================================
# Nginx — phục vụ SPA (React build) + reverse proxy /api -> backend
# Dùng trong container frontend của docker-compose.prod.yml
# =====================================================================

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    # Giới hạn kích thước upload (khớp prod backend: multipart 15MB)
    client_max_body_size 20m;

    # Gzip cho asset tĩnh
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # ── API: chuyển tiếp tới backend (same-origin, không CORS) ──────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── fitness-ai-service: WebSocket pose realtime (chấm điểm thử thách) ──
    # FE nối tới wss://<host>/pose/ws/exercise/{type} → strip /pose → fitness-ai:5001
    location /pose/ {
        proxy_pass         http://fitness-ai:5001/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # giữ websocket lâu
        proxy_send_timeout 3600s;
    }

    # ── File upload do backend phục vụ (ảnh, video minh hoạ) ───────────
    location /uploads/ {
        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Asset có hash: cache dài hạn ───────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback: mọi route khác trả index.html (client-side routing) ─
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Không cache index.html để deploy mới ăn ngay
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
