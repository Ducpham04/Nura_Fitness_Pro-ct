name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: -Fit_Ai_Challenge_Wep-App_FE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: -Fit_Ai_Challenge_Wep-App_FE/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Build
        env:
          # CI build should not rely on runtime hostname detection
          VITE_API_URL: http://localhost:8080
          VITE_FITNESS_AI_URL: http://localhost:5001
          VITE_USE_MOCK_API: "false"
        run: |
          npm run build

      - name: NPM audit (non-blocking)
        run: |
          npm audit --audit-level=high || true

  backend:
    name: Backend (test + package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fit_Ai_Challenge_Web-App_BE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: |
          ./mvnw -B test

      - name: Build package
        run: |
          ./mvnw -B -DskipTests package

  python_ai:
    name: Python AI (import + basic checks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: fitness-ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import check
        run: |
          python -c "import fastapi; import cv2; import mediapipe; import numpy; print('ok')"

      - name: pip-audit (non-blocking)
        run: |
          python -m pip install pip-audit
          pip-audit || true

  lighthouse:
    name: Lighthouse (FE performance budget)
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: -Fit_Ai_Challenge_Wep-App_FE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm ci

      - name: Build
        env:
          VITE_API_URL: http://localhost:8080
          VITE_FITNESS_AI_URL: http://localhost:5001
          VITE_USE_MOCK_API: "true"
        run: |
          npm run build

      - name: Install LHCI
        run: |
          npm i -D @lhci/cli

      - name: Run Lighthouse CI (static dist)
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          npx lhci autorun --config ../lighthouserc.json

  k6:
    name: k6 (API smoke / load)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 scripts (smoke)
        env:
          API_BASE_URL: http://localhost:8080
        run: |
          # These are templates; they require a running backend to be meaningful.
          # Keep them as CI artifacts and run in staging/preview environment.
          k6 run perf/k6/api-smoke.js || true
