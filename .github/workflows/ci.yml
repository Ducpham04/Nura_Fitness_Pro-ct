name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Build
        env:
          # CI build should not rely on runtime hostname detection
          VITE_API_URL: http://localhost:8080
          VITE_FITNESS_AI_URL: http://localhost:5001
          VITE_USE_MOCK_API: "false"
        run: |
          npm run build

      - name: NPM audit (non-blocking)
        run: |
          npm audit --audit-level=high || true

  backend:
    name: Backend (test + package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: |
          ./mvnw -B test

      - name: Build package
        run: |
          ./mvnw -B -DskipTests package

  python_ai:
    name: Python AI (import + basic checks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: fitness-ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import check
        run: |
          python -c "import fastapi; import cv2; import mediapipe; import numpy; print('ok')"

      - name: pip-audit (non-blocking)
        run: |
          python -m pip install pip-audit
          pip-audit || true
