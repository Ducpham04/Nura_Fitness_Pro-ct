# =====================================================================
# Bản nginx.conf dùng khi chạy trên EC2 + docker-compose.
#
# Chỉ khác frontend/nginx.conf ở phần phân giải tên upstream:
#   ECS  : backend.nura.local:8080  qua resolver VPC 169.254.169.253
#   EC2  : backend:8080             qua DNS nội bộ docker 127.0.0.11
# Mọi thứ còn lại (SEO fallback, cache, redirect) giữ nguyên 1:1 —
# sửa file kia thì phải sửa file này.
# =====================================================================

server {
    listen 80;
    server_name _;

    # TLS terminate ở Caddy trên host -> nginx không biết scheme thật là https
    absolute_redirect off;

    # DNS nội bộ của docker (embedded DNS server), TTL ngắn để bắt kịp khi
    # container restart đổi IP. Dùng biến trong proxy_pass để nginx KHÔNG
    # cache IP vĩnh viễn lúc boot -> backend khởi động sau vẫn kết nối được.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # ── API: chuyển tiếp tới backend (same-origin, không CORS) ──────────
    location /api/ {
        set $be_api "backend:8080";
        proxy_pass         http://$be_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── fitness-ai: WebSocket pose realtime ─────────────────────────────
    location /pose/ {
        set $be_pose "fitness-ai:5001";
        rewrite ^/pose/(.*) /$1 break;
        proxy_pass         http://$be_pose;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── File upload do backend phục vụ ──────────────────────────────────
    location /uploads/ {
        set $be_up "backend:8080";
        proxy_pass         http://$be_up;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /login    { return 301 /; }
    location = /register { return 301 /; }

    # SPA fallback: trang prerender trước, rồi mới về index.html gốc
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
