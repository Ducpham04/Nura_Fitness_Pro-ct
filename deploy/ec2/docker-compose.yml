# =====================================================================
# Fitnit Challenge — stack chạy trên 1 EC2 (thay thế ECS Fargate + ALB)
#
# Khác docker-compose.prod.yml ở chỗ: KHÔNG build, chỉ pull image đã có
# sẵn trên ECR (đúng những image đang chạy prod) -> deploy nhanh, và bảo
# đảm chạy y hệt cái đang phục vụ người dùng.
#
# Chạy (trên EC2, từ thư mục gốc repo):
#   aws ecr get-login-password --region ap-southeast-1 \
#     | docker login --username AWS --password-stdin $ECR_REGISTRY
#   docker compose -p fitnit-prod -f deploy/ec2/docker-compose.yml up -d
#
# Điểm vào public: Caddy chạy trên host (80/443) -> 127.0.0.1:8088.
# Không container nào bind ra ngoài loopback.
# =====================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── PostgreSQL 18 ───────────────────────────────────────────────────
  # PHẢI là 18 để khớp RDS nura-challenge (18.3) — dump từ 18 KHÔNG restore
  # được vào 16. Tên DB/user giữ y hệt prod để dump nạp thẳng, không sửa.
  db:
    image: postgres:18-alpine
    container_name: fit-prod-db
    restart: always
    logging: *default-logging
    mem_limit: 512m
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER là bắt buộc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD là bắt buộc}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fit-network]

  # ── Spring Boot backend ─────────────────────────────────────────────
  backend:
    image: ${ECR_REGISTRY}/nura-prod/nura-backend:latest
    container_name: fit-prod-backend
    restart: always
    logging: *default-logging
    mem_limit: 1024m
    depends_on:
      db:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60"
      SPRING_PROFILES_ACTIVE: prod
      # DB nội bộ trong docker thay cho RDS
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?}
      POSE_SIGNING_SECRET: ${POSE_SIGNING_SECRET:?}
      AI_SERVICE_URL: http://ai-service:8001
      # Ảnh/video vẫn nằm trên S3 (STORAGE_PROVIDER=s3) — EC2 dùng IAM role
      # instance, không cần access key trong file env.
      STORAGE_PROVIDER: s3
      S3_UPLOAD_BUCKET: ${S3_UPLOAD_BUCKET:?}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      # Tách khỏi PUBLIC_ORIGIN: lúc chạy thử cần cho thêm hostname tạm
      # (ec2.viway.id.vn) vào danh sách, nhưng PUBLIC_ORIGIN phải giữ nguyên
      # domain thật vì nó đi vào link email, VNPay return URL, canonical...
      # Trình duyệt gửi Origin nên bị CORS chặn 403; curl không gửi nên lọt —
      # đó là lý do test bằng curl thấy "bình thường" mà người dùng thì không
      # đăng nhập được.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${PUBLIC_ORIGIN:?}}
      APP_PUBLIC_BASE_URL: ${PUBLIC_ORIGIN}
      FRONTEND_URL: ${PUBLIC_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Fitnit Challenge}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${PUBLIC_ORIGIN}/payment/result
      VNPAY_IPN_URL: ${PUBLIC_ORIGIN}/api/ai-packages/payment/ipn
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}
      SEPAY_API_KEY: ${SEPAY_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [fit-network]

  # ── FastAPI: sinh kế hoạch (Groq) ───────────────────────────────────
  ai-service:
    image: ${ECR_REGISTRY}/nura-prod/nura-ai-service:latest
    container_name: fit-prod-ai
    restart: always
    logging: *default-logging
    mem_limit: 384m
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      BE_API_URL: http://backend:8080
      GROQ_API_KEY: ${GROQ_API_KEY:?}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [fit-network]

  # ── MediaPipe pose realtime (WebSocket chấm điểm) ───────────────────
  fitness-ai:
    image: ${ECR_REGISTRY}/nura-prod/nura-fitness-ai:latest
    container_name: fit-prod-pose-ai
    restart: always
    logging: *default-logging
    mem_limit: 768m
    environment:
      HOST: 0.0.0.0
      PORT: 5001
      MEDIAPIPE_MODEL_COMPLEXITY: ${MEDIAPIPE_MODEL_COMPLEXITY:-1}
      POSE_SIGNING_SECRET: ${POSE_SIGNING_SECRET:?}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [fit-network]

  # ── Frontend nginx: SPA + reverse proxy ─────────────────────────────
  # nginx.conf trong image ECR trỏ tới Cloud Map (backend.nura.local +
  # resolver VPC 169.254.169.253) — không dùng được trong mạng docker, nên
  # đè bằng bản ./nginx.conf (resolver 127.0.0.11, host `backend`).
  frontend:
    image: ${ECR_REGISTRY}/nura-prod/nura-frontend:latest
    container_name: fit-prod-frontend
    restart: always
    logging: *default-logging
    mem_limit: 128m
    depends_on: [backend, fitness-ai]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Chỉ loopback — để chẩn đoán bằng curl trên máy; internet vào qua Caddy
      - "127.0.0.1:8088:80"
    networks: [fit-network]

  # ── Caddy: TLS + điểm vào public 80/443 ─────────────────────────────
  # Chạy bằng container thay vì cài trên host: Amazon Linux 2023 không có
  # gói caddy trong repo (không EPEL), và cài từ binary tải về thì không
  # có đường cập nhật vá lỗi.
  # caddy_data GIỮ CHỨNG CHỈ Let's Encrypt — mất volume này là phải xin lại
  # cert, dễ chạm rate-limit (5 cert/domain/tuần).
  caddy:
    image: caddy:2-alpine
    container_name: fit-prod-caddy
    restart: always
    logging: *default-logging
    mem_limit: 128m
    depends_on: [frontend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [fit-network]

  # ── Backup DB → S3 hằng đêm ─────────────────────────────────────────
  # BẮT BUỘC: tự host DB nghĩa là không còn snapshot tự động của RDS.
  db-backup:
    image: postgres:18-alpine
    container_name: fit-prod-db-backup
    restart: always
    logging: *default-logging
    mem_limit: 192m
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-19}   # 2h sáng giờ VN
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-southeast-1}
      # Không đặt AWS key — dùng IAM role của instance
    volumes:
      - ../../scripts/backup-entrypoint.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache aws-cli >/dev/null 2>&1 && exec /backup.sh loop"]
    networks: [fit-network]

networks:
  fit-network:
    driver: bridge

volumes:
  db_data:
  caddy_data:
  caddy_config:
